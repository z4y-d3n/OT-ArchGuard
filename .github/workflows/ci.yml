name: Python verification

on:
  push:
    branches: ['v1.2', 'codex/v12-08-final-release-hardening', 'codex/release-1.2.0-preparation', 'codex/v13-*', 'codex/v14-*', 'main']
  pull_request:
    branches: ['v1.2', 'main']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        os: ['windows-latest', 'ubuntu-latest', 'macos-latest']
        python: ['3.12', '3.14']
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Verify independent history root
        env:
          EXPECTED_ROOT_SHA: ${{ vars.EXPECTED_ROOT_SHA }}
        run: |
          if (-not $env:EXPECTED_ROOT_SHA) { throw "Configure EXPECTED_ROOT_SHA for the new repository" }
          $roots = @(git rev-list --max-parents=0 HEAD)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($roots.Count -ne 1 -or $roots[0] -ne $env:EXPECTED_ROOT_SHA) { throw "Unexpected repository ancestry" }
      - name: Install approved verification dependencies
        run: python -m pip install -r tools/verification-requirements.txt
      - name: Verify exact committed public source bytes
        run: python tools/verify_source_checkout.py --output output/source-checkout.json
      - name: Build exact versioned distributions and record their filenames
        run: |
          python -c "import os; from pathlib import Path; from setuptools import build_meta; wheel=build_meta.build_wheel('output/artifacts'); sdist=build_meta.build_sdist('output/artifacts'); stream=Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8'); stream.write('OTARCHGUARD_WHEEL='+wheel+'\nOTARCHGUARD_SDIST='+sdist+'\n'); stream.close()"
      - name: Audit the exact built distributions
        run: python tools/audit_release.py "output/artifacts/$env:OTARCHGUARD_WHEEL" "output/artifacts/$env:OTARCHGUARD_SDIST" --source-root . --output output/archive-audit.json
      - name: Install the exact audited candidate wheel
        run: python -m pip install --force-reinstall --no-index --no-deps --no-build-isolation "output/artifacts/$env:OTARCHGUARD_WHEEL"
      - name: Verify installed distribution, imports and native console
        run: python tools/verify_environment.py --output output/environment-${{ matrix.os }}-${{ matrix.python }}.json
      - name: Ruff lint
        run: python -m ruff check .
      - name: Ruff formatting
        run: python -m ruff format --check .
      - name: Strict mypy
        run: python -m mypy
      - name: Dependency consistency
        run: python -m pip check
      - name: Full suite with Python network operations denied in child processes
        env:
          OTARCHGUARD_OFFLINE_CHECK: '1'
          PYTHONPATH: '${{ github.workspace }}/tools/offline'
        run: python -m pytest --basetemp=.pytest_tmp --tb=short --junitxml=output/full-suite.xml
      - name: Reproduce immutable v1.2 native compatibility offline
        env:
          OTARCHGUARD_OFFLINE_CHECK: '1'
          PYTHONPATH: '${{ github.workspace }}/tools/offline'
          PIP_NO_INDEX: '1'
        run: python -m tools.verify_legacy_candidate --output output/native-compatibility
      - name: Validate frozen read-only evidence consumers offline
        env:
          OTARCHGUARD_OFFLINE_CHECK: '1'
          PYTHONPATH: '${{ github.workspace }}/tools/offline'
        run: |
          python -m tools.read_capture_evidence tests/fixtures/capture-contract-v2/supported > output/evidence-consumer-supported.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m tools.read_capture_evidence tests/fixtures/capture-contract-v2/limited > output/evidence-consumer-limited.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute documented synthetic walkthroughs offline
        env:
          OTARCHGUARD_OFFLINE_CHECK: '1'
          PYTHONPATH: '${{ github.workspace }}/tools/offline'
        run: python examples/run_examples.py
      - name: Validate v1.4 foundation and original protocol corpus offline
        env:
          OTARCHGUARD_OFFLINE_CHECK: '1'
          PYTHONPATH: '${{ github.workspace }}/tools/offline'
        run: |
          python -m tools.protocol_corpus --manifest tests/fixtures/protocol-corpus/manifest.json --verify synthetic-industrial --file tests/fixtures/protocol-corpus/synthetic-industrial.pcap
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m tools.evidence_walkthrough --output output/evidence-walkthrough
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m tools.evidence_history_walkthrough --output output/evidence-history-walkthrough
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m tools.drift_walkthrough --output output/drift-walkthrough
      - name: Verify installed sdist and project walkthrough offline
        env:
          OTARCHGUARD_OFFLINE_CHECK: '1'
          PYTHONPATH: '${{ github.workspace }}/tools/offline'
          PIP_NO_INDEX: '1'
        run: |
          python -m pip install --force-reinstall --no-index --no-deps --no-build-isolation "output/artifacts/$env:OTARCHGUARD_SDIST"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/verify_environment.py --output output/installed-sdist.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest tests --basetemp=output/sdist-tmp --tb=short --junitxml=output/sdist-suite.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m tools.project_walkthrough --output output/project-walkthrough
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $explorerOutput = Join-Path ([System.IO.Path]::GetTempPath()) ('otarchguard-explorer-' + [guid]::NewGuid().ToString('N'))
          python -m tools.explorer_walkthrough --output $explorerOutput
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath (Join-Path $explorerOutput 'walkthrough.json') -Destination output/explorer-walkthrough.json
          python -m tools.document_walkthrough --output output/document-walkthrough
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m tools.quality_walkthrough --output output/quality-walkthrough
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m tools.capture_walkthrough --output output/capture-walkthrough
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m tools.drift_walkthrough --output output/sdist-drift-walkthrough
      - name: Record exact revision and candidate source identity
        run: |
          python -c "import hashlib,json,os,pathlib,platform,subprocess; r=pathlib.Path('.'); files={n:hashlib.sha256((r/n).read_bytes()).hexdigest() for n in (r/'tools/public-files.txt').read_text().splitlines()}; pathlib.Path('output/ci-revision.json').write_text(json.dumps({'tested_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'pr_head':os.getenv('PR_HEAD'),'run_id':os.getenv('GITHUB_RUN_ID'),'run_attempt':os.getenv('GITHUB_RUN_ATTEMPT'),'platform':platform.platform(),'python':platform.python_version(),'public_source_sha256':hashlib.sha256(json.dumps(files,sort_keys=True,separators=(',',':')).encode()).hexdigest()},sort_keys=True,indent=2))"
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
      - name: Retain candidate integrity evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: candidate-integrity-${{ matrix.os }}-${{ matrix.python }}
          retention-days: 30
          if-no-files-found: error
          path: |
            output/artifacts/*
            output/archive-audit.json
            output/source-checkout.json
            output/full-suite.xml
            output/sdist-suite.xml
            output/installed-sdist.json
            output/project-walkthrough/walkthrough.json
            output/explorer-walkthrough.json
            output/document-walkthrough/walkthrough.json
            output/quality-walkthrough/walkthrough.json
            output/capture-walkthrough/walkthrough.json
            output/evidence-walkthrough/walkthrough.json
            output/evidence-history-walkthrough/walkthrough.json
            output/drift-walkthrough/walkthrough.json
            output/sdist-drift-walkthrough/walkthrough.json
            output/ci-revision.json
            output/native-compatibility/comparison.json
            output/native-compatibility/command-*.stdout
            output/native-compatibility/command-*.stderr
            output/native-compatibility/baseline/*
            output/native-compatibility/candidate/*
            output/evidence-consumer-*.json
            tests/fixtures/capture-contract-v2/manifest.json
            tests/fixtures/capture-interoperability/manifest.json
            tests/fixtures/capture-interoperability/reference-decoder.json
            output/environment-${{ matrix.os }}-${{ matrix.python }}.json
      - name: Measure fixed NFR-05 workloads offline
        env:
          OTARCHGUARD_OFFLINE_CHECK: '1'
          PYTHONPATH: '${{ github.workspace }}/tools/offline'
        run: python -m benchmarks.run --output output/benchmark-${{ matrix.os }}-${{ matrix.python }}.json
      - name: Measure synthetic quality and comparison workloads offline
        env:
          OTARCHGUARD_OFFLINE_CHECK: '1'
          PYTHONPATH: '${{ github.workspace }}/tools/offline'
        run: python -m benchmarks.quality_comparison --output output/quality-benchmark.json
      - name: Measure synthetic capture workloads offline
        env:
          OTARCHGUARD_OFFLINE_CHECK: '1'
          PYTHONPATH: '${{ github.workspace }}/tools/offline'
        run: python -m benchmarks.capture --output output/capture-benchmark
      - name: Retain benchmark evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: benchmark-${{ matrix.os }}-${{ matrix.python }}
          path: |
            output/benchmark-${{ matrix.os }}-${{ matrix.python }}.json
            output/quality-benchmark.json
            output/capture-benchmark/benchmark.json
          retention-days: 7
          if-no-files-found: warn
