name: Python verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        os: ['windows-latest', 'ubuntu-latest', 'macos-latest']
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Verify independent history root
        env:
          EXPECTED_ROOT_SHA: ${{ vars.EXPECTED_ROOT_SHA }}
        run: |
          if (-not $env:EXPECTED_ROOT_SHA) { throw "Configure EXPECTED_ROOT_SHA for the new repository" }
          $roots = @(git rev-list --max-parents=0 HEAD)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($roots.Count -ne 1 -or $roots[0] -ne $env:EXPECTED_ROOT_SHA) { throw "Unexpected repository ancestry" }
      - name: Install approved verification dependencies and a regular package wheel
        run: |
          python -m pip install -r tools/verification-requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-build-isolation --no-deps .
      - name: Verify installed distribution, imports and native console
        run: python tools/verify_environment.py --output output/environment-${{ matrix.os }}-${{ matrix.python }}.json
      - name: Ruff lint
        run: python -m ruff check .
      - name: Ruff formatting
        run: python -m ruff format --check .
      - name: Strict mypy
        run: python -m mypy
      - name: Dependency consistency
        run: python -m pip check
      - name: Full suite with Python network operations denied in child processes
        env:
          OTARCHGUARD_OFFLINE_CHECK: '1'
          PYTHONPATH: '${{ github.workspace }}/tools/offline'
        run: python -m pytest --basetemp=.pytest_tmp --tb=short
      - name: Execute documented synthetic walkthroughs offline
        env:
          OTARCHGUARD_OFFLINE_CHECK: '1'
          PYTHONPATH: '${{ github.workspace }}/tools/offline'
        run: python examples/run_examples.py
      - name: Build and audit exact candidate distributions
        run: |
          python -c "from setuptools import build_meta; build_meta.build_wheel('output/artifacts'); build_meta.build_sdist('output/artifacts')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/audit_release.py output/artifacts/otarchguard-1.1.0-py3-none-any.whl output/artifacts/otarchguard-1.1.0.tar.gz --source-root . --output output/archive-audit.json
      - name: Retain candidate integrity evidence
        uses: actions/upload-artifact@v7.0.2
        with:
          name: candidate-integrity-${{ matrix.os }}-${{ matrix.python }}
          retention-days: 7
          path: |
            output/artifacts/*
            output/archive-audit.json
            output/environment-${{ matrix.os }}-${{ matrix.python }}.json
      - name: Measure fixed NFR-05 workloads offline
        env:
          OTARCHGUARD_OFFLINE_CHECK: '1'
          PYTHONPATH: '${{ github.workspace }}/tools/offline'
        run: python -m benchmarks.run --output output/benchmark-${{ matrix.os }}-${{ matrix.python }}.json
      - name: Retain benchmark evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: benchmark-${{ matrix.os }}-${{ matrix.python }}
          path: output/benchmark-${{ matrix.os }}-${{ matrix.python }}.json
          retention-days: 7
          if-no-files-found: warn
