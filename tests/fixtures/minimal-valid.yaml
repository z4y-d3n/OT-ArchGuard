schema_version: 1
architecture_id: minimal
revision: initial
suc:
  id: demo_minimal
  name: Synthetic minimal cell
  purpose: Demonstrate a small declared schema contract.
  controlled_process: Imaginary controller and engineering workstation.
  boundary_description: Both assets are internal in one zone; no perimeter edge.
  completeness_assertion: Finite synthetic inventory only; physical access and actual configuration omitted.
  access_points: []
  external_dependencies: []
zones:
  - id: control
    name: Control
    purpose: Synthetic supervision.
    scope: internal
    grouping_rationale: Two non-safety IACS assets grouped for this teaching case.
    safety_designation: non_safety
assets:
  - id: eng
    name: Engineering workstation
    role: Engineering
    zone_id: control
    kind: endpoint
    scope: internal
    domain_classification: iacs
    safety_classification: non_safety
    criticality: medium
  - id: plc
    name: Synthetic controller
    role: Controller
    zone_id: control
    kind: endpoint
    scope: internal
    domain_classification: iacs
    safety_classification: non_safety
    criticality: critical
interfaces:
  - id: eng_net
    asset_id: eng
    placement_zone_id: control
    ipv4: 192.0.2.10/24
  - id: plc_net
    asset_id: plc
    placement_zone_id: control
    ipv4: 192.0.2.20/24
conduits: []
transport_edges:
  - id: t_eng_plc
    source_interface_id: eng_net
    destination_interface_id: plc_net
forwarding_edges: []
services:
  - id: svc_plc
    asset_id: plc
    interface_id: plc_net
    protocol: tcp
    destination_ports: [{start: 502, end: 502}]
rules:
  - id: allow_eng_plc
    edge_ids: [t_eng_plc]
    source: {asset_ids: [eng]}
    destination: {asset_ids: [plc]}
    protocol: tcp
    destination_ports: [{start: 502, end: 502}]
    effect: allow
intents:
  - id: req_eng_plc
    kind: required
    source: {asset_ids: [eng]}
    destination_service_ids: [svc_plc]
scenarios:
  - id: engineering_scope
    origin_asset_ids: [eng]
    destination_service_ids: [svc_plc]
